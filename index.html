<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Moon - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      border-radius: 20px;
      color: white;
      backdrop-filter: blur(5px);
    }

    button {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      font-size: 28px;
      font-weight: bold;
      color: white;
      background: #333;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.9);
      background: #555;
    }

    #speedText {
      min-width: 100px;
      text-align: center;
      font-size: 16px;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">🔍 กำลังค้นหา Hiro Marker...</div>

  <div id="controls">
    <button id="slowBtn" aria-label="ลดความเร็ว">−</button>
    <div id="speedText">ความเร็ว: 1.00x</div>
    <button id="fastBtn" aria-label="เพิ่มความเร็ว">+</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-entity camera></a-entity>

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-entity id="moonGroup" position="0 0.8 0">
        <a-sphere
          id="moon"
          radius="0.65"
          segments-width="64"
          segments-height="64"
          color="#d8d8d8"
          material="roughness: 1;"
        ></a-sphere>

        <a-sphere radius="0.13" position="0.35 0.25 0.55"
          color="#999999" scale="1 0.35 0.15"></a-sphere>

        <a-sphere radius="0.09" position="-0.4 0.2 0.48"
          color="#999999" scale="1 0.35 0.15"></a-sphere>

        <a-sphere radius="0.11" position="0.1 -0.35 0.58"
          color="#aaaaaa" scale="1 0.35 0.15"></a-sphere>

        <a-sphere radius="0.07" position="-0.25 -0.2 0.58"
          color="#888888" scale="1 0.35 0.15"></a-sphere>

        <a-torus
          radius="0.9"
          radius-tubular="0.008"
          rotation="90 0 0"
          color="#ffffff"
          opacity="0.35"
          material="transparent: true;"
        ></a-torus>
      </a-entity>
    </a-marker>
  </a-scene>

  <script>
    let rotationSpeed = 1.0;

    const MIN_SPEED = 0;
    const MAX_SPEED = 5;
    const SPEED_STEP = 0.25;

    const moonGroup = document.getElementById("moonGroup");
    const hiroMarker = document.getElementById("hiroMarker");
    const fastBtn = document.getElementById("fastBtn");
    const slowBtn = document.getElementById("slowBtn");
    const speedText = document.getElementById("speedText");
    const statusText = document.getElementById("status");

    function updateSpeedText() {
      speedText.innerText = "ความเร็ว: " + rotationSpeed.toFixed(2) + "x";
    }

    fastBtn.addEventListener("click", function () {
      rotationSpeed = Math.min(MAX_SPEED, rotationSpeed + SPEED_STEP);
      updateSpeedText();
    });

    slowBtn.addEventListener("click", function () {
      rotationSpeed = Math.max(MIN_SPEED, rotationSpeed - SPEED_STEP);
      updateSpeedText();
    });

    hiroMarker.addEventListener("markerFound", function () {
      statusText.innerText = "🌙 พบ Hiro Marker แล้ว!";
    });

    hiroMarker.addEventListener("markerLost", function () {
      statusText.innerText = "🔍 กำลังค้นหา Hiro Marker...";
    });

    let lastTime = performance.now();

    function animateMoon(currentTime) {
      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      if (rotationSpeed > 0 && moonGroup) {
        moonGroup.object3D.rotation.y += deltaTime * rotationSpeed;
      }

      requestAnimationFrame(animateMoon);
    }

    requestAnimationFrame(animateMoon);
    updateSpeedText();
  </script>
</body>
</html>
